<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B0716" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/portfolio/favicon.svg" />
    <!-- <title> and <meta name="description"> are set per page by React (see each page component). -->
    <!-- Link previews (LinkedIn, X, WhatsApp…) don't run JavaScript, so these stay static. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Assim Ben Ahmed" />
    <meta property="og:title" content="Assim Ben Ahmed — AI Engineer · Data Scientist" />
    <meta property="og:description" content="I build AI that ships, and lead the teams that ship it. Available now · 12- or 24-month alternance · Paris" />
    <meta property="og:url" content="https://assim-ben-ahmed.github.io/portfolio/" />
    <meta property="og:image" content="https://assim-ben-ahmed.github.io/portfolio/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Assim Ben Ahmed — AI Engineer · Data Scientist" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:locale:alternate" content="fr_FR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Assim Ben Ahmed — AI Engineer · Data Scientist" />
    <meta name="twitter:description" content="I build AI that ships, and lead the teams that ship it." />
    <meta name="twitter:image" content="https://assim-ben-ahmed.github.io/portfolio/og-image.jpg" />
    <!-- Language before first paint (same rule as src/i18n). Pre-rendered pages are English, so French
         visitors keep them hidden until React has rendered the French version (removed in App.tsx). -->
    <style>html.pr-hide #root { visibility: hidden; }</style>
    <script>
      (function (d) {
        var saved
        try { saved = localStorage.getItem('lang') } catch (e) {}
        var lang = saved === 'en' || saved === 'fr' ? saved : (navigator.language || '').toLowerCase().indexOf('fr') === 0 ? 'fr' : 'en'
        d.lang = lang
        if (lang !== 'en' && d.hasAttribute('data-prerendered')) d.classList.add('pr-hide')
      })(document.documentElement)
    </script>
    <!-- GitHub Pages SPA redirect: restores the deep link that 404.html encoded in the query string -->
    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) { return s.replace(/~and~/g, '&') }).join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
